<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomodoroAI - Focus Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍅 PomodoroAI</h1>
            <p class="tagline">Stay focused, beat distractions</p>
        </header>

        <main>
            <div class="timer-display">
                <div class="mode-indicator" id="modeIndicator">Work Time</div>
                <div class="time" id="timeDisplay">25:00</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-primary">Start</button>
                <button id="pauseBtn" class="btn btn-secondary" disabled>Pause</button>
                <button id="resetBtn" class="btn btn-secondary">Reset</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Pomodoros Today</div>
                    <div class="stat-value" id="pomodoroCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Current Cycle</div>
                    <div class="stat-value" id="cycleType">Work</div>
                </div>
            </div>

            <div class="settings">
                <h2>Settings</h2>
                <div class="setting-group">
                    <label for="workDuration">Work Duration (minutes):</label>
                    <input type="number" id="workDuration" min="1" max="60" value="25">
                </div>
                <div class="setting-group">
                    <label for="breakDuration">Break Duration (minutes):</label>
                    <input type="number" id="breakDuration" min="1" max="30" value="5">
                </div>
                <button id="applySettings" class="btn btn-small">Apply Settings</button>
            </div>
        </main>

        <footer>
            <p>Built with focus 🎯</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
