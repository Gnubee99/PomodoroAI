version: '3.8'

services:
  pomodoro:
    build: .
    container_name: pomodoro-ai
    ports:
      - "5000:5000"
    volumes:
      # Mount volume for data persistence
      - pomodoro-data:/data
    environment:
      - HOME=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pomodoro-data:
    driver: local
